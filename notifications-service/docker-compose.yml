services:
  notifications-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI: http://localhost:8025

  notifications-api:
    build:
      context: .
      dockerfile: src/Notifications.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # The Aspire Dashboard is shared by the platform and started from orders-service/docker-compose.yml.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4317"
      # Keycloak is defined in the root docker-compose.yml (docker compose up -d keycloak) and published on 8180.
      Authentication__MetadataAddress: "http://host.docker.internal:8180/realms/commerce/.well-known/openid-configuration"
      ConnectionStrings__NotificationsDb: "Host=notifications-db;Port=5432;Database=notifications;Username=postgres;Password=postgres"
      # RabbitMQ is shared by the whole platform and is started from orders-service/docker-compose.yml.
      RabbitMq__Host: "host.docker.internal"
      Smtp__Host: "mailpit"
    ports:
      - "8082:8080"
    depends_on:
      notifications-db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  notifications-db-data:
