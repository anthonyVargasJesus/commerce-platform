name: Orders CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: orders-service

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      orders: ${{ steps.filter.outputs.orders }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            orders:
              - 'orders-service/**'

  orders-build-and-test:
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        if: needs.changes.outputs.orders == 'true'
        uses: actions/checkout@v4

      - name: Setup .NET
        if: needs.changes.outputs.orders == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        if: needs.changes.outputs.orders == 'true'
        run: dotnet restore

      - name: Build
        if: needs.changes.outputs.orders == 'true'
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        if: needs.changes.outputs.orders == 'true'
        run: dotnet test tests/Orders.UnitTests --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Integration tests
        if: needs.changes.outputs.orders == 'true'
        run: dotnet test tests/Orders.IntegrationTests --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Publish test results
        if: always() && needs.changes.outputs.orders == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orders-test-results
          path: orders-service/TestResults

  orders-docker-build:
    needs: [changes, orders-build-and-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        if: needs.changes.outputs.orders == 'true'
        uses: actions/checkout@v4

      - name: Build Docker image
        if: needs.changes.outputs.orders == 'true'
        run: docker build -f src/Orders.API/Dockerfile -t orders-api:${{ github.sha }} .
        working-directory: orders-service
