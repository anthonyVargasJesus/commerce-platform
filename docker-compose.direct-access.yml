# Publishes the services' own ports next to the gateway, for Swagger and debugging:
#   docker compose -f docker-compose.yml -f docker-compose.direct-access.yml up --build
# They still require a Keycloak token (Swagger UI has an Authorize button for it).
services:
  inventory-api:
    ports:
      - "8080:8080"
  orders-api:
    ports:
      - "8081:8080"
  notifications-api:
    ports:
      - "8082:8080"
