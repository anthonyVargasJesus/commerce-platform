services:
  inventory-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5433:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-api:
    build:
      context: .
      dockerfile: src/Inventory.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # The Aspire Dashboard is shared by the platform and started from orders-service/docker-compose.yml.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4317"
      # Keycloak is defined in the root docker-compose.yml (docker compose up -d keycloak) and published on 8180.
      Authentication__MetadataAddress: "http://host.docker.internal:8180/realms/commerce/.well-known/openid-configuration"
      ConnectionStrings__InventoryDb: "Host=inventory-db;Port=5432;Database=inventory;Username=inventory;Password=inventory"
      # RabbitMQ is shared by the whole platform and is started from orders-service/docker-compose.yml.
      RabbitMq__Host: "host.docker.internal"
    ports:
      - "8080:8080"
    depends_on:
      inventory-db:
        condition: service_healthy

volumes:
  inventory-db-data:
