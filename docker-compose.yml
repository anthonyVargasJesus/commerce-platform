# Whole platform in one command:  docker compose up --build
#
# Each service also has its own docker-compose.yml for working on it alone; do not run both at once
# (they publish the same host ports). APIs run in the Development environment so they apply their
# EF Core migrations on startup.
#
# The three APIs are NOT published: the only way in is the gateway. To reach them directly (Swagger, debugging)
# add the override:  docker compose -f docker-compose.yml -f docker-compose.direct-access.yml up
#
# Host ports: gateway 8000, Keycloak 8180, RabbitMQ console 15672, Mailpit (captured emails) 8025,
# Aspire Dashboard (traces, metrics, logs) 18888.

name: commerce-platform

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"   # dashboard UI: http://localhost:18888
      - "4317:18889"    # OTLP gRPC: services running outside Docker export here (default endpoint)

  inventory-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5433:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1434:1433"
    volumes:
      - orders-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  notifications-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications"]
      interval: 10s
      timeout: 5s
      retries: 10

  inventory-api:
    build:
      context: ./inventory-service
      dockerfile: src/Inventory.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      Authentication__MetadataAddress: "http://keycloak:8080/realms/commerce/.well-known/openid-configuration"
      ConnectionStrings__InventoryDb: "Host=inventory-db;Port=5432;Database=inventory;Username=inventory;Password=inventory"
      RabbitMq__Host: "rabbitmq"
    depends_on:
      keycloak:
        condition: service_healthy
      inventory-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  orders-api:
    build:
      context: ./orders-service
      dockerfile: src/Orders.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      ServiceAuth__TokenEndpoint: "http://keycloak:8080/realms/commerce/protocol/openid-connect/token"
      ServiceAuth__ClientId: "orders-service"
      ServiceAuth__ClientSecret: "orders-service-dev-secret"
      Authentication__MetadataAddress: "http://keycloak:8080/realms/commerce/.well-known/openid-configuration"
      ConnectionStrings__OrdersDb: "Server=orders-db,1433;Database=orders;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
      Services__Inventory__BaseUrl: "http://inventory-api:8080"
      RabbitMq__Host: "rabbitmq"
    depends_on:
      keycloak:
        condition: service_healthy
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-api:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI: http://localhost:8025

  notifications-api:
    build:
      context: ./notifications-service
      dockerfile: src/Notifications.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      Authentication__MetadataAddress: "http://keycloak:8080/realms/commerce/.well-known/openid-configuration"
      ConnectionStrings__NotificationsDb: "Host=notifications-db;Port=5432;Database=notifications;Username=postgres;Password=postgres"
      RabbitMq__Host: "rabbitmq"
      Smtp__Host: "mailpit"
    depends_on:
      keycloak:
        condition: service_healthy
      notifications-db:
        condition: service_healthy
      mailpit:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens always carry this issuer, whether they were requested through localhost or the Docker network.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/commerce-realm.json:/opt/keycloak/data/import/commerce-realm.json:ro
    ports:
      - "8180:8080"   # admin console and token endpoint: http://localhost:8180 (admin / admin)
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  gateway:
    build:
      context: ./gateway
      dockerfile: src/Gateway.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      Authentication__MetadataAddress: "http://keycloak:8080/realms/commerce/.well-known/openid-configuration"
      ReverseProxy__Clusters__inventory__Destinations__primary__Address: "http://inventory-api:8080/"
      ReverseProxy__Clusters__orders__Destinations__primary__Address: "http://orders-api:8080/"
      ReverseProxy__Clusters__notifications__Destinations__primary__Address: "http://notifications-api:8080/"
    ports:
      - "8000:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      inventory-api:
        condition: service_started
      orders-api:
        condition: service_started
      notifications-api:
        condition: service_started

volumes:
  rabbitmq-data:
  inventory-db-data:
  orders-db-data:
  notifications-db-data:
